name: gerenciador

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: gerenciador
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Sao_Paulo
    ports:
      # 5433 no host para nao brigar com um Postgres local na 5432
      - "${DB_PORT:-5433}:5432"
    volumes:
      # so rodam na primeira subida, com o volume vazio
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      # a partir do Postgres 18 o volume e /var/lib/postgresql, nao mais .../data
      - dados:/var/lib/postgresql
    healthcheck:
      # via TCP de proposito: durante os scripts de init o servidor so atende
      # pelo socket local, e o app ainda nao conseguiria conectar
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d gerenciador"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    # CLI interativa: sobe com "docker compose run --rm app", nao com "up"
    profiles: [app]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/gerenciador
      DB_USER: postgres
      DB_PASSWORD: postgres
      TZ: America/Sao_Paulo
    stdin_open: true
    tty: true

volumes:
  dados:
